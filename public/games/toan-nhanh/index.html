<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toán nhanh</title>
<link rel="stylesheet" href="../../fonts/fonts-inline.css">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  .card { width:var(--S); background:#fff; border-radius:18px; box-shadow:0 6px 0 rgba(0,0,0,.15); padding:clamp(14px,3vh,28px); text-align:center; position:relative; }
  #q { font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(40px,10vh,84px); line-height:1.1; margin:6px 0 14px; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .opts .btn { font-size:clamp(22px,5vh,38px); padding:clamp(10px,2.6vh,20px) 6px; }
  .bar { height:12px; background:#E4EBFA; border-radius:99px; overflow:hidden; margin-bottom:10px; } .bar i { display:block; height:100%; background:var(--ok); width:100%; transition:width .1s linear; }
  .opts .btn.right { background:#9CE5BC; } .opts .btn.wrong { background:#FFB3B5; }
</style>
</head>
<body>
<div class="top"><span class="pill">Điểm: <b id="score">0</b></span><span class="pill">Chuỗi đúng: <b id="streak">0</b></span><span class="pill">Còn lại: <b id="tm">60</b>s</span></div>
<div class="card stage"><div class="bar"><i id="bar"></i></div><div id="q">?</div><div class="opts" id="opts"></div><div class="overlay" id="end"></div></div>
<div class="msg" id="msg">Chọn đáp án đúng thật nhanh. Bấm phím 1–4 cũng được.</div>
<script src="../../sdk/grc-sdk.js"></script>
<script src="../_shared/kit.js"></script>
<script>
(function () {
  var $ = Kit.$, score, streak, time, solved, q, state = 'idle', LIMIT = 60;
  function range(n) { return Math.floor(Math.random() * n); }
  function make() {
    var lv = Math.min(5, 1 + Math.floor(solved / 5)), a, b, op, ans, text;
    var ops = ['+', '-']; if (lv >= 2) ops.push('×'); if (lv >= 4) ops.push('÷');
    op = Kit.pick(ops);
    var top = [0, 10, 20, 50, 100, 100][lv];
    if (op === '+') { a = 1 + range(top); b = 1 + range(top); ans = a + b; }
    else if (op === '-') { a = 1 + range(top); b = 1 + range(a); ans = a - b; }
    else if (op === '×') { var m = lv >= 4 ? 12 : 9; a = 2 + range(m - 1); b = 2 + range(m - 1); ans = a * b; }
    else { b = 2 + range(10); ans = 2 + range(11); a = b * ans; }
    text = a + ' ' + op + ' ' + b;
    var set = {}; set[ans] = 1; var guard = 0;
    while (Object.keys(set).length < 4 && guard++ < 50) { var d = (1 + range(Math.max(3, Math.min(10, Math.abs(ans)) ))) * (Math.random() < .5 ? -1 : 1); var w = ans + d; if (w >= 0) set[w] = 1; }
    return { text: text, ans: ans, opts: Kit.shuffle(Object.keys(set).map(Number)) };
  }
  function show() {
    q = make(); $('q').textContent = q.text + ' = ?';
    var o = $('opts'); o.innerHTML = '';
    q.opts.forEach(function (v, i) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = v; b.dataset.v = v; b.dataset.k = i + 1;
      b.onclick = function () { pick(v, b); }; o.appendChild(b);
    });
  }
  function pick(v, btn) {
    if (state !== 'play' || Kit.paused) return;
    if (v === q.ans) {
      streak++; solved++; var gain = 10 + Math.min(streak, 10) * 2; score += gain; time = Math.min(LIMIT + 10, time + (streak % 5 === 0 ? 3 : 0));
      Kit.sfx('ok'); Kit.say($('msg'), '+' + gain + ' điểm' + (streak % 5 === 0 ? ' và +3 giây!' : ''), 'ok'); Kit.score(score);
      btn.classList.add('right'); state = 'wait'; setTimeout(function () { state = 'play'; show(); }, 160);
    } else {
      streak = 0; time -= 3; Kit.sfx('bad'); Kit.say($('msg'), 'Chưa đúng, trừ 3 giây. Đáp án là ' + q.ans + '.', 'bad'); btn.classList.add('wrong');
      state = 'wait'; setTimeout(function () { state = 'play'; show(); }, 600);
    }
    $('score').textContent = score; $('streak').textContent = streak;
  }
  function end() {
    state = 'over'; Kit.sfx('lose'); Kit.score(score);
    var e = $('end'); e.innerHTML = '<h2>Hết giờ!</h2><p>Bạn trả lời đúng <b>' + solved + '</b> câu, <b>' + score + '</b> điểm.</p><button class="btn primary" id="again" type="button">Chơi lại</button>';
    e.classList.add('show'); $('again').onclick = start;
  }
  function start() { score = 0; streak = 0; solved = 0; time = LIMIT; state = 'play'; $('end').classList.remove('show'); $('score').textContent = 0; $('streak').textContent = 0; Kit.say($('msg'), 'Chọn đáp án đúng thật nhanh. Bấm phím 1–4 cũng được.'); show(); }
  Kit.loop(function (dt) {
    if (state === 'play' || state === 'wait') { time -= dt; if (time <= 0) { time = 0; end(); } }
    $('tm').textContent = Math.ceil(time); $('bar').style.width = Math.max(0, time / (LIMIT + 10) * 100) + '%';
    $('bar').style.background = time < 10 ? 'var(--bad)' : 'var(--ok)';
  });
  document.addEventListener('keydown', function (e) { var b = document.querySelector('.opts .btn[data-k="' + e.key + '"]'); if (b) b.click(); });
  Kit.init({ timeUp: function () { Kit.score(score); } });
  window.__g = { get q() { return q; }, get score() { return score; }, answer: function (ok) { var v = ok ? q.ans : q.opts.find(function (x) { return x !== q.ans; }); var b = document.querySelector('.opts .btn[data-v="' + v + '"]'); b.click(); } };
  start();
})();
</script>
</body>
</html>
