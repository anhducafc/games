<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đánh vần tiếng Anh</title>
<link rel="stylesheet" href="../../fonts/fonts-inline.css">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  .card { width:var(--S); background:#fff; border-radius:20px; box-shadow:0 6px 0 rgba(0,0,0,.15); padding:clamp(12px,2.6vh,24px); text-align:center; position:relative; }
  #pic { font-size:clamp(64px,17vh,130px); line-height:1.1; font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif; }
  #vi { font-weight:700; color:var(--soft); margin:2px 0 8px; font-size:clamp(14px,2.6vh,19px); }
  .slots, .tiles { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:8px 0; }
  .slot { width:clamp(34px,9vh,52px); height:clamp(42px,10vh,60px); border-radius:10px; border:3px dashed #B8C6E8; display:flex; align-items:center; justify-content:center; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(22px,5vh,34px); text-transform:uppercase; }
  .slot.fill { border:3px solid #2F6BFF; background:#EAF1FF; cursor:pointer; } .slot.hint { border-color:#FFB547; background:#FFF3DA; } .slot.good { border-color:var(--ok); background:#DDF7E9; } .slot.bad { border-color:var(--bad); background:#FFE0E1; }
  .tile { width:clamp(38px,10vh,56px); height:clamp(44px,11vh,62px); border:0; border-radius:12px; background:#FFE9A8; box-shadow:0 4px 0 #E3C566; font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(22px,5vh,34px); text-transform:uppercase; cursor:pointer; color:var(--ink); }
  .tile.used { visibility:hidden; }
  .tile:active { transform:translateY(2px); }
</style>
</head>
<body>
<div class="top"><span class="pill">Từ: <b id="n">1</b>/10</span><span class="pill">Điểm: <b id="score">0</b></span><span class="pill">Chuỗi: <b id="streak">0</b></span></div>
<div class="card stage"><div id="pic"></div><div id="vi"></div><div class="slots" id="slots"></div><div class="tiles" id="tiles"></div><div class="overlay" id="end"></div></div>
<div class="msg" id="msg">Nghe, nhìn hình rồi ghép các chữ cái thành từ tiếng Anh. Có thể gõ bằng bàn phím.</div>
<div class="row"><button class="btn" id="say" type="button">🔊 Nghe</button><button class="btn" id="hint" type="button">💡 Gợi ý (−5)</button><button class="btn" id="clear" type="button">⌫ Xoá</button><button class="btn" id="skip" type="button">Bỏ qua</button></div>
<script src="../../sdk/grc-sdk.js"></script>
<script src="../_shared/kit.js"></script>
<script>
(function () {
  var $ = Kit.$;
  // [từ, emoji, nghĩa tiếng Việt, cấp]
  var W = [
    ['cat','🐱','con mèo',1],['dog','🐶','con chó',1],['sun','☀️','mặt trời',1],['egg','🥚','quả trứng',1],['bus','🚌','xe buýt',1],['cup','🥤','cái cốc',1],['hat','🎩','cái mũ',1],['pig','🐷','con heo',1],['bee','🐝','con ong',1],['bed','🛏️','cái giường',1],['car','🚗','xe hơi',1],['key','🔑','chìa khoá',1],['ant','🐜','con kiến',1],['fox','🦊','con cáo',1],['owl','🦉','con cú',1],['map','🗺️','bản đồ',1],['pen','🖊️','cái bút',1],['box','📦','cái hộp',1],['ice','🧊','đá lạnh',1],
    ['apple','🍎','quả táo',2],['bread','🍞','bánh mì',2],['tiger','🐯','con hổ',2],['horse','🐴','con ngựa',2],['house','🏠','ngôi nhà',2],['robot','🤖','người máy',2],['water','💧','nước',2],['mouse','🐭','con chuột',2],['sheep','🐑','con cừu',2],['grape','🍇','quả nho',2],['lemon','🍋','quả chanh',2],['pizza','🍕','bánh pizza',2],['clock','🕒','đồng hồ',2],['plane','✈️','máy bay',2],['train','🚆','tàu hoả',2],['phone','📱','điện thoại',2],['snake','🐍','con rắn',2],['whale','🐳','cá voi',2],['tooth','🦷','cái răng',2],['heart','❤️','trái tim',2],['chair','🪑','cái ghế',2],['cloud','☁️','đám mây',2],['flower','🌸','bông hoa',2],['banana','🍌','quả chuối',2],['orange','🍊','quả cam',2],['monkey','🐵','con khỉ',2],['rabbit','🐰','con thỏ',2],['turtle','🐢','con rùa',2],['spider','🕷️','con nhện',2],['guitar','🎸','đàn ghi-ta',2],['bridge','🌉','cây cầu',2],['school','🏫','trường học',2],['pencil','✏️','bút chì',2],
    ['dolphin','🐬','cá heo',3],['giraffe','🦒','hươu cao cổ',3],['penguin','🐧','chim cánh cụt',3],['rainbow','🌈','cầu vồng',3],['umbrella','☂️','cái ô',3],['butterfly','🦋','con bướm',3],['elephant','🐘','con voi',3],['computer','💻','máy tính',3],['football','⚽','quả bóng đá',3],['bicycle','🚲','xe đạp',3],['mountain','⛰️','ngọn núi',3],['sandwich','🥪','bánh mì kẹp',3],['strawberry','🍓','quả dâu tây',3],['hospital','🏥','bệnh viện',3],['dinosaur','🦖','khủng long',3],['pineapple','🍍','quả dứa',3],['telescope','🔭','kính thiên văn',3],['kangaroo','🦘','chuột túi',3],['crocodile','🐊','cá sấu',3]
  ].filter(function (w) { return w[3] > 0; });
  var round, idx, cur, score, streak, got, order, used, state, hints, wrong, level = 1;
  function pickWords() {
    var lv = function (l) { return Kit.shuffle(W.filter(function (w) { return w[3] === l; })); };
    return lv(1).slice(0, 3).concat(lv(2).slice(0, 5), lv(3).slice(0, 2));
  }
  function start() { round = pickWords(); idx = 0; score = 0; streak = 0; $('end').classList.remove('show'); $('score').textContent = 0; $('streak').textContent = 0; next(); }
  function next() {
    if (idx >= round.length) return finish();
    cur = round[idx]; got = []; used = []; hints = 0; wrong = 0; state = 'play';
    var word = cur[0], letters = word.split('');
    order = Kit.shuffle(letters.map(function (c, i) { return { c: c, i: i }; }));
    if (order.length > 2 && order.every(function (o, k) { return o.c === letters[k]; })) order.reverse();
    $('pic').textContent = cur[1]; $('vi').textContent = cur[2]; $('n').textContent = idx + 1;
    var sl = $('slots'); sl.innerHTML = ''; letters.forEach(function (c, k) { var d = document.createElement('div'); d.className = 'slot'; d.dataset.k = k; d.onclick = function () { back(k); }; sl.appendChild(d); });
    var tl = $('tiles'); tl.innerHTML = ''; order.forEach(function (o, k) { var b = document.createElement('button'); b.type = 'button'; b.className = 'tile'; b.textContent = o.c; b.dataset.k = k; b.onclick = function () { tap(k); }; tl.appendChild(b); });
    Kit.say($('msg'), 'Nghe, nhìn hình rồi ghép các chữ cái thành từ tiếng Anh. Có thể gõ bằng bàn phím.'); setTimeout(speak, 250); render();
  }
  function speak() { try { if (!window.speechSynthesis) return; speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(cur[0]); u.lang = 'en-US'; u.rate = .8; speechSynthesis.speak(u); } catch (e) {} }
  function render() {
    var slots = $('slots').children;
    for (var k = 0; k < slots.length; k++) { var o = got[k]; slots[k].textContent = o ? o.c : ''; slots[k].className = 'slot' + (o ? ' fill' : '') + (o && o.hint ? ' hint' : ''); }
    [].forEach.call($('tiles').children, function (b, k) { b.classList.toggle('used', used.indexOf(k) >= 0); });
  }
  function tap(k) {
    if (state !== 'play' || Kit.paused || used.indexOf(k) >= 0) return;
    used.push(k); got.push({ c: order[k].c, k: k }); Kit.sfx('tap'); render();
    if (got.length === cur[0].length) check();
  }
  function tapLetter(ch) { for (var k = 0; k < order.length; k++) if (used.indexOf(k) < 0 && order[k].c === ch) { tap(k); return; } }
  function back(i) { // bỏ chữ từ vị trí i trở đi (trừ chữ gợi ý)
    if (state !== 'play') return; if (got[i] && got[i].hint) return;
    while (got.length > i) { var o = got.pop(); if (o.hint) { got.push(o); break; } used.splice(used.indexOf(o.k), 1); } render();
  }
  function check() {
    var s = got.map(function (o) { return o.c; }).join(''), slots = $('slots').children;
    if (s === cur[0]) {
      state = 'wait'; streak++; var gain = Math.max(5, 20 - hints * 5 - wrong * 3) + Math.min(streak, 5) * 2; score += gain;
      for (var k = 0; k < slots.length; k++) slots[k].classList.add('good'); Kit.sfx('ok'); Kit.say($('msg'), 'Đúng rồi! +' + gain + ' điểm', 'ok'); Kit.score(score);
      $('score').textContent = score; $('streak').textContent = streak; speak(); setTimeout(function () { idx++; next(); }, 1300);
    } else {
      wrong++; streak = 0; $('streak').textContent = 0; Kit.sfx('bad'); Kit.say($('msg'), 'Chưa đúng. Thử sắp xếp lại nhé!', 'bad');
      for (var k2 = 0; k2 < slots.length; k2++) slots[k2].classList.add('bad');
      state = 'wait'; setTimeout(function () { state = 'play'; while (got.length) { var o = got.pop(); if (o.hint) { got.push(o); break; } } used = got.map(function (o) { return o.k; }); render(); }, 600);
    }
  }
  function hint() {
    if (state !== 'play' || Kit.paused) return; var word = cur[0];
    // xoá các chữ sai đang đặt rồi điền chữ kế tiếp đúng
    var pos = 0; while (pos < got.length && got[pos].c === word[pos]) pos++;
    while (got.length > pos) { var o = got.pop(); used.splice(used.indexOf(o.k), 1); }
    if (pos >= word.length) return; var ch = word[pos];
    for (var k = 0; k < order.length; k++) if (used.indexOf(k) < 0 && order[k].c === ch) { used.push(k); got.push({ c: ch, k: k, hint: true }); break; }
    hints++; Kit.sfx('ok'); render(); if (got.length === word.length) check();
  }
  function finish() {
    state = 'over'; Kit.score(score); Kit.sfx('win');
    var e = $('end'); e.innerHTML = '<h2>Hoàn thành 10 từ! 🎉</h2><p>Điểm: <b>' + score + '</b></p><button class="btn primary" id="r1" type="button">Chơi vòng mới</button>'; e.classList.add('show'); $('r1').onclick = start;
  }
  $('say').onclick = speak; $('hint').onclick = hint; $('clear').onclick = function () { back(0); };
  $('skip').onclick = function () { if (state !== 'play') return; state = 'wait'; streak = 0; $('streak').textContent = 0; Kit.say($('msg'), 'Đáp án: ' + cur[0], 'bad'); setTimeout(function () { idx++; next(); }, 1400); };
  document.addEventListener('keydown', function (e) {
    if (/^[a-zA-Z]$/.test(e.key)) tapLetter(e.key.toLowerCase()); else if (e.key === 'Backspace') { e.preventDefault(); back(Math.max(0, got.length - 1)); }
  });
  Kit.init({ timeUp: function () { Kit.score(score); } });
  window.__g = { get cur() { return cur; }, get score() { return score; }, get state() { return state; }, type: tapLetter, get words() { return W; } };
  start();
})();
</script>
</body>
</html>
