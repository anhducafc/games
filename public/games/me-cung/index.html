<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mê cung</title>
<link rel="stylesheet" href="../../fonts/fonts-inline.css">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  canvas { width:var(--S); height:var(--S); border-radius:14px; background:#fff; box-shadow:0 6px 0 rgba(0,0,0,.18); touch-action:none; display:block; }
  .dpad { display:grid; grid-template-columns:repeat(3,56px); grid-template-rows:repeat(2,50px); gap:6px; }
  .dpad .btn { padding:0; font-size:24px; } .dpad .u{grid-column:2} .dpad .l{grid-column:1;grid-row:2} .dpad .d{grid-column:2;grid-row:2} .dpad .r{grid-column:3;grid-row:2}
  @media (hover:hover) and (pointer:fine) { .dpad { display:none; } }
</style>
</head>
<body>
<div class="top"><span class="pill">Màn: <b id="lv">1</b></span><span class="pill">Thời gian: <b id="tm">0:00</b></span><span class="pill">Điểm: <b id="score">0</b></span></div>
<div class="stage"><canvas id="c" width="620" height="620"></canvas><div class="overlay" id="end"></div></div>
<div class="msg" id="msg">Dẫn chấm xanh tới ngôi sao. Dùng phím mũi tên / WASD, vuốt trên mê cung hoặc bấm nút.</div>
<div class="dpad"><button class="btn u" data-d="0,-1" type="button">▲</button><button class="btn l" data-d="-1,0" type="button">◀</button><button class="btn d" data-d="0,1" type="button">▼</button><button class="btn r" data-d="1,0" type="button">▶</button></div>
<script src="../../sdk/grc-sdk.js"></script>
<script src="../_shared/kit.js"></script>
<script>
(function () {
  var $ = Kit.$, cv = $('c'), g = cv.getContext('2d');
  var W, H, cells, px, py, ex, ey, level = 1, score = 0, time = 0, state = 'play', trail = [], anim = 0;
  var TIME_BASE = 60;
  function size() { return Math.min(7 + level * 2, 25); }
  function gen() {
    W = H = size(); cells = [];
    for (var y = 0; y < H; y++) { cells.push([]); for (var x = 0; x < W; x++) cells[y].push({ n: 1, e: 1, s: 1, w: 1, v: 0 }); }
    var st = [[0, 0]]; cells[0][0].v = 1;
    while (st.length) {
      var c = st[st.length - 1], nb = [];
      [[0, -1, 'n', 's'], [1, 0, 'e', 'w'], [0, 1, 's', 'n'], [-1, 0, 'w', 'e']].forEach(function (d) {
        var nx = c[0] + d[0], ny = c[1] + d[1];
        if (nx >= 0 && ny >= 0 && nx < W && ny < H && !cells[ny][nx].v) nb.push([nx, ny, d[2], d[3]]);
      });
      if (!nb.length) { st.pop(); continue; }
      var n = Kit.pick(nb); cells[c[1]][c[0]][n[2]] = 0; cells[n[1]][n[0]][n[3]] = 0; cells[n[1]][n[0]].v = 1; st.push([n[0], n[1]]);
    }
    px = 0; py = 0; ex = W - 1; ey = H - 1; trail = [[0, 0]]; time = TIME_BASE + level * 8; state = 'play';
    $('lv').textContent = level; $('end').classList.remove('show');
    Kit.say($('msg'), 'Dẫn chấm xanh tới ngôi sao. Dùng phím mũi tên / WASD, vuốt trên mê cung hoặc bấm nút.');
  }
  function tryMove(dx, dy) {
    if (state !== 'play' || Kit.paused) return;
    var c = cells[py][px], k = dx > 0 ? 'e' : dx < 0 ? 'w' : dy > 0 ? 's' : 'n';
    if (c[k]) { Kit.sfx('bad'); return; }
    px += dx; py += dy; Kit.sfx('move');
    var i = trail.findIndex(function (t) { return t[0] === px && t[1] === py; });
    if (i >= 0) trail.length = i + 1; else trail.push([px, py]);
    if (px === ex && py === ey) win();
  }
  function win() {
    state = 'won'; var bonus = Math.max(0, Math.floor(time)) * 2 + 100 * level; score += bonus; Kit.score(score); Kit.sfx('win');
    var e = $('end'); e.innerHTML = '<h2>Ra khỏi mê cung!</h2><p>+' + bonus + ' điểm</p><button class="btn primary" id="nx" type="button">Màn tiếp theo</button>';
    e.classList.add('show'); $('nx').onclick = function () { level++; gen(); };
  }
  function lose() {
    state = 'lost'; Kit.sfx('lose'); Kit.score(score);
    var e = $('end'); e.innerHTML = '<h2>Hết giờ!</h2><p>Bạn qua được ' + (level - 1) + ' màn, ' + score + ' điểm</p><button class="btn primary" id="rs" type="button">Chơi lại</button>';
    e.classList.add('show'); $('rs').onclick = function () { level = 1; score = 0; gen(); };
  }
  function draw(t) {
    var s = cv.width, cs = s / W, pad = 6;
    g.clearRect(0, 0, s, s); g.fillStyle = '#FFF8E8'; g.fillRect(0, 0, s, s);
    g.fillStyle = 'rgba(79,141,255,.22)'; trail.forEach(function (p) { g.fillRect(p[0] * cs + 2, p[1] * cs + 2, cs - 4, cs - 4); });
    g.strokeStyle = '#1B2A4A'; g.lineWidth = Math.max(2, cs * .09); g.lineCap = 'round'; g.beginPath();
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var c = cells[y][x], X = x * cs, Y = y * cs;
      if (c.n) { g.moveTo(X, Y); g.lineTo(X + cs, Y); } if (c.w) { g.moveTo(X, Y); g.lineTo(X, Y + cs); }
      if (y === H - 1 && c.s) { g.moveTo(X, Y + cs); g.lineTo(X + cs, Y + cs); } if (x === W - 1 && c.e) { g.moveTo(X + cs, Y); g.lineTo(X + cs, Y + cs); }
    }
    g.stroke();
    // sao đích
    var sx = ex * cs + cs / 2, sy = ey * cs + cs / 2, R = cs * .36 + Math.sin(t * 4) * cs * .03;
    g.fillStyle = '#FFB547'; g.beginPath();
    for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? R * .45 : R; g.lineTo(sx + Math.cos(a) * r, sy + Math.sin(a) * r); }
    g.closePath(); g.fill();
    // người chơi
    g.fillStyle = '#2F7BFF'; g.beginPath(); g.arc(px * cs + cs / 2, py * cs + cs / 2, cs * .3, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(px * cs + cs / 2 - cs * .08, py * cs + cs / 2 - cs * .06, cs * .07, 0, 7); g.arc(px * cs + cs / 2 + cs * .1, py * cs + cs / 2 - cs * .06, cs * .07, 0, 7); g.fill();
  }
  Kit.loop(function (dt, t) {
    if (state === 'play') { time -= dt; if (time <= 0) { time = 0; lose(); } }
    $('tm').textContent = Kit.fmt(time); $('score').textContent = score; draw(t);
  });
  document.addEventListener('keydown', function (e) {
    var m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1] }[e.key];
    if (m) { e.preventDefault(); tryMove(m[0], m[1]); }
  });
  document.querySelectorAll('.dpad .btn').forEach(function (b) {
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); var d = b.dataset.d.split(',').map(Number); tryMove(d[0], d[1]); });
  });
  var sx0, sy0;
  cv.addEventListener('pointerdown', function (e) { sx0 = e.clientX; sy0 = e.clientY; });
  cv.addEventListener('pointermove', function (e) {
    if (sx0 == null) return; var dx = e.clientX - sx0, dy = e.clientY - sy0, T = 26;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < T) return;
    if (Math.abs(dx) > Math.abs(dy)) tryMove(dx < 0 ? -1 : 1, 0); else tryMove(0, dy < 0 ? -1 : 1);
    sx0 = e.clientX; sy0 = e.clientY;
  });
  cv.addEventListener('pointerup', function () { sx0 = null; }); cv.addEventListener('pointercancel', function () { sx0 = null; });
  Kit.init({ timeUp: function () { Kit.score(score); } });
  window.__g = { tryMove: tryMove, get pos() { return [px, py]; }, get exit() { return [ex, ey]; }, get cells() { return cells; }, get level() { return level; }, get score() { return score; } };
  gen();
})();
</script>
</body>
</html>
