<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dò mìn</title>
<link rel="stylesheet" href="../../fonts/fonts-inline.css">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  #grid { width:var(--S); aspect-ratio:1; display:grid; gap:2px; background:#8A9BC4; padding:2px; border-radius:12px; box-shadow:0 6px 0 rgba(0,0,0,.18); touch-action:manipulation; }
  .c { background:#C9D6F5; border-radius:5px; display:flex; align-items:center; justify-content:center; font-family:'Baloo 2',sans-serif; font-weight:800; cursor:pointer; font-size:calc(var(--S) / var(--n) * .62); line-height:1; }
  .c.open { background:#F6F9FF; cursor:default; } .c.mine { background:#FFB3B5; } .c.boom { background:#E5484D; }
  .c.n1{color:#2F6BFF}.c.n2{color:#1E9D5A}.c.n3{color:#E5484D}.c.n4{color:#6B3FD6}.c.n5{color:#B5651D}.c.n6{color:#0E9AA7}.c.n7{color:#333}.c.n8{color:#777}
  .seg { display:flex; background:#fff; border-radius:14px; padding:3px; box-shadow:0 3px 0 rgba(0,0,0,.12); } .seg button { border:0; background:none; font:inherit; font-weight:700; padding:6px 12px; border-radius:11px; cursor:pointer; color:var(--ink); } .seg button.on { background:var(--accent); }
</style>
</head>
<body>
<div class="top"><span class="pill">Mìn còn: <b id="mines">10</b></span><span class="pill">Thời gian: <b id="tm">0</b>s</span><span class="pill">Kỷ lục: <b id="best">0</b></span></div>
<div class="stage"><div id="grid"></div><div class="overlay" id="end"></div></div>
<div class="msg" id="msg">Chạm ô để mở. Chuyển sang chế độ 🚩 (hoặc bấm giữ / chuột phải) để cắm cờ nơi có mìn.</div>
<div class="row"><div class="seg" id="mode"><button class="on" data-m="open" type="button">⛏ Mở ô</button><button data-m="flag" type="button">🚩 Cắm cờ</button></div>
<div class="seg" id="lvl"><button class="on" data-l="0" type="button">Dễ 9×9</button><button data-l="1" type="button">Vừa 12×12</button><button data-l="2" type="button">Khó 14×14</button></div>
<button class="btn primary" id="again" type="button">Ván mới</button></div>
<script src="../../sdk/grc-sdk.js"></script>
<script src="../_shared/kit.js"></script>
<script>
(function () {
  var $ = Kit.$, LV = [{ n: 9, m: 10 }, { n: 12, m: 24 }, { n: 14, m: 38 }];
  var lvl = 0, n, mines, cells, state, time, flags, opened, mode = 'open', firstDone, bestTimes = [0, 0, 0];
  function idx(r, c) { return r * n + c; }
  function nbrs(i) { var r = (i / n) | 0, c = i % n, o = []; for (var dr = -1; dr <= 1; dr++) for (var dc = -1; dc <= 1; dc++) { if (!dr && !dc) continue; var rr = r + dr, cc = c + dc; if (rr >= 0 && cc >= 0 && rr < n && cc < n) o.push(idx(rr, cc)); } return o; }
  function build() {
    n = LV[lvl].n; mines = LV[lvl].m; state = 'ready'; time = 0; flags = 0; opened = 0; firstDone = false; cells = [];
    for (var i = 0; i < n * n; i++) cells.push({ m: 0, o: 0, f: 0, a: 0 });
    var g = $('grid'); g.style.gridTemplateColumns = 'repeat(' + n + ',1fr)'; g.style.setProperty('--n', n); g.innerHTML = '';
    for (var k = 0; k < n * n; k++) {
      var d = document.createElement('div'); d.className = 'c'; d.dataset.i = k; g.appendChild(d);
    }
    $('end').classList.remove('show'); upd(); Kit.say($('msg'), 'Chạm ô để mở. Chuyển sang chế độ 🚩 (hoặc bấm giữ / chuột phải) để cắm cờ nơi có mìn.');
  }
  function plant(safe) {
    var ban = {}; ban[safe] = 1; nbrs(safe).forEach(function (x) { ban[x] = 1; });
    var pool = []; for (var i = 0; i < n * n; i++) if (!ban[i]) pool.push(i);
    Kit.shuffle(pool).slice(0, mines).forEach(function (i) { cells[i].m = 1; });
    cells.forEach(function (c, i) { c.a = nbrs(i).filter(function (j) { return cells[j].m; }).length; });
  }
  function el(i) { return $('grid').children[i]; }
  function paint(i) {
    var c = cells[i], d = el(i); d.className = 'c'; d.textContent = '';
    if (c.o) { d.classList.add('open'); if (c.m) { d.classList.add('boom'); d.textContent = '💣'; } else if (c.a) { d.classList.add('n' + c.a); d.textContent = c.a; } }
    else if (c.f) d.textContent = '🚩';
  }
  function reveal(i) {
    var st = [i];
    while (st.length) {
      var j = st.pop(), c = cells[j]; if (c.o || c.f) continue;
      c.o = 1; opened++; paint(j);
      if (!c.a && !c.m) nbrs(j).forEach(function (x) { if (!cells[x].o) st.push(x); });
    }
  }
  function open(i) {
    if (state === 'over' || state === 'won' || Kit.paused) return;
    var c = cells[i]; if (c.f) return;
    if (!firstDone) { plant(i); firstDone = true; state = 'play'; }
    if (c.o) { // bấm vào số: mở các ô xung quanh nếu đã cắm đủ cờ
      var fl = nbrs(i).filter(function (x) { return cells[x].f; }).length;
      if (c.a && fl === c.a) nbrs(i).forEach(function (x) { if (!cells[x].o && !cells[x].f) { if (cells[x].m) lose(x); else reveal(x); } });
      check(); return;
    }
    if (c.m) { lose(i); return; }
    reveal(i); Kit.sfx('tap'); check();
  }
  function flag(i) {
    if (state === 'over' || state === 'won' || Kit.paused) return; var c = cells[i]; if (c.o) return;
    c.f = c.f ? 0 : 1; flags += c.f ? 1 : -1; paint(i); Kit.sfx('move'); upd();
  }
  function lose(i) {
    state = 'over'; Kit.sfx('boom');
    cells.forEach(function (c, j) { if (c.m) { c.o = 1; paint(j); } }); el(i).classList.add('boom');
    $('grid').classList.add('shake'); setTimeout(function () { $('grid').classList.remove('shake'); }, 400);
    var e = $('end'); e.style.background = 'rgba(238,243,255,.82)'; e.innerHTML = '<h2>Trúng mìn!</h2><button class="btn primary" id="r2" type="button">Chơi lại</button>'; e.classList.add('show'); $('r2').onclick = build;
  }
  function check() {
    if (state !== 'play' || opened !== n * n - mines) return;
    state = 'won'; Kit.sfx('win');
    var base = [100, 300, 600][lvl], score = Math.max(10, base * 3 - Math.floor(time) * 2 + base);
    Kit.score(score);
    if (!bestTimes[lvl] || time < bestTimes[lvl]) bestTimes[lvl] = Math.floor(time);
    var e = $('end'); e.style.background = 'rgba(238,243,255,.88)'; e.innerHTML = '<h2>Gỡ xong bãi mìn! 🎉</h2><p>Thời gian ' + Math.floor(time) + ' giây · ' + score + ' điểm</p><button class="btn primary" id="r3" type="button">Ván mới</button>'; e.classList.add('show'); $('r3').onclick = build;
    upd();
  }
  function upd() { $('mines').textContent = mines - flags; $('tm').textContent = Math.floor(time); $('best').textContent = bestTimes[lvl] ? bestTimes[lvl] + 's' : '—'; }
  var press = null, long = false;
  $('grid').addEventListener('pointerdown', function (e) {
    var d = e.target.closest('.c'); if (!d) return; long = false; var i = +d.dataset.i;
    press = setTimeout(function () { long = true; flag(i); if (navigator.vibrate) navigator.vibrate(15); }, 420); d._p = 1;
  });
  function release(e) { clearTimeout(press); }
  $('grid').addEventListener('pointerup', function (e) {
    release(); var d = e.target.closest('.c'); if (!d || long) return; var i = +d.dataset.i;
    if (e.button === 2) return;
    if (mode === 'flag') flag(i); else open(i);
  });
  $('grid').addEventListener('pointerleave', release); $('grid').addEventListener('pointercancel', release);
  $('grid').addEventListener('contextmenu', function (e) { e.preventDefault(); var d = e.target.closest('.c'); if (d) flag(+d.dataset.i); });
  $('mode').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; mode = b.dataset.m; [].forEach.call($('mode').children, function (x) { x.classList.toggle('on', x === b); }); });
  $('lvl').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; lvl = +b.dataset.l; [].forEach.call($('lvl').children, function (x) { x.classList.toggle('on', x === b); }); build(); });
  $('again').onclick = build;
  Kit.loop(function (dt) { if (state === 'play') { time += dt; $('tm').textContent = Math.floor(time); } });
  Kit.init({});
  window.__g = { open: function (i) { open(i); }, flag: function (i) { flag(i); }, get cells() { return cells; }, get state() { return state; }, get n() { return n; } };
  build();
})();
</script>
</body>
</html>
